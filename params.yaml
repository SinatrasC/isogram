data:
  seed: 42
  output_dir: data/processed/main
  local_paths: []
  local_pre_split: true
  local_train_path: data/external/hf_splits/train.parquet
  local_val_path: data/external/hf_splits/validation.parquet
  local_test_path: data/external/hf_splits/test.parquet
  local_source_name: sinatras/isogram-ai-text-detection-splits
  local_license: other
  local_sample_rows: null
  hf_dataset: sinatras/isogram-ai-text-detection-splits
  hf_split: train
  hf_license: other
  hf_pre_split: true
  hf_train_split: train
  hf_val_split: validation
  hf_test_split: test
  hf_sample_rows: 60000
  hf_shuffle_buffer: 10000
  skip_hf: true
  val_fraction: 0.1
  test_fraction: 0.1

training:
  dataset:
    train: data/processed/main/train.csv
    val: data/processed/main/val.csv
    test: data/processed/main/test.csv
  char_cnn:
    epochs: 5
    batch_size: 64
    learning_rate: 0.001
  deberta:
    epochs: 1
    batch_size: 16
    learning_rate: 0.00002
    amp: true

mlflow:
  tracking_uri: http://127.0.0.1:8080
  experiment: isogram
