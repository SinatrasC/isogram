[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isogram"
version = "0.1.0"
description = "PyTorch AI-generated essay detection service"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "sentencepiece>=0.2,<1.0",
    "torch>=2.3,<3.0",
    "transformers>=4.40,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
kaggle = [
    "kaggle>=1.6,<2.0",
]

[project.scripts]
isogram-prepare = "isogram.data.prepare:main"
isogram-train = "isogram.train:main"
isogram-evaluate = "isogram.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
