[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isogram"
version = "0.1.0"
description = "PyTorch AI-generated essay detection service"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.7,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sentencepiece>=0.2,<1.0",
    "torch>=2.3,<3.0",
    "transformers>=4.40,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]
kaggle = [
    "kaggle>=1.6,<2.0",
]
hf = [
    "datasets>=2.20,<4.0",
]
mlops = [
    "dvc>=3.60,<4.0",
    "hydra-core>=1.3,<2.0",
    "mlflow>=2.19,<4.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
]

[project.scripts]
isogram-build-dataset = "isogram.data.build_dataset:main"
isogram-train-hydra = "isogram.hydra_train:main"
isogram-prepare = "isogram.data.prepare:main"
isogram-train = "isogram.train:main"
isogram-evaluate = "isogram.evaluate:main"
isogram-serve = "isogram.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isogram = ["static/*.html", "conf/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["isogram"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
