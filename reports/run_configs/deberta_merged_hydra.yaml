dataset:
  name: merged
  train: data/processed/merged/train.csv
  val: data/processed/merged/val.csv
  test: data/processed/merged/test.csv
  metadata: data/processed/merged/metadata.json
model:
  name: deberta
  model_version: deberta-merged-v1
  epochs: 1
  batch_size: 16
  learning_rate: 2.0e-05
  dropout: 0.2
  amp: true
  deberta_model_name: microsoft/deberta-v3-base
  deberta_max_length: 512
paths:
  output: artifacts/checkpoints/deberta_merged.pt
  report_output: reports/deberta_merged_training.json
  run_config_dir: reports/run_configs
training:
  seed: 42
  device: cuda
  grad_accum_steps: 1
  log_every: 50
  limit_rows: null
mlflow:
  enabled: true
  tracking_uri: file:mlruns
  experiment: isogram
  run_name: deberta-merged-standardized-5080
